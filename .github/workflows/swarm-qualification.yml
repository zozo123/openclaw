name: Swarm stack qualification
on:
  push:
    branches: [chore/swarm-qualification-20260920]
permissions:
  contents: read
concurrency:
  group: swarm-qualification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualify:
    if: github.repository == 'zozo123/openclaw'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact reviewed stack
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: e716fc735ee93a2cefb01282b2a5a9105b1e8c3a
          persist-credentials: false
          fetch-depth: 1
      - name: Prepare isolated evidence directory
        run: |
          mkdir -p .artifacts/swarm-qualification
          git rev-parse HEAD > .artifacts/swarm-qualification/commit.txt
      - name: Install repository-pinned toolchain
        uses: ./.github/actions/setup-node-env
        with:
          node-version: 24.x
          cache-mode: off
          dependency-cache: false
          install-deps: true
          install-bun: false
          vitest-fs-cache: false
          restore-test-caches: false
      - name: Format only the reviewed dynamics scope
        id: format
        continue-on-error: true
        run: |
          pnpm exec oxfmt --write src/agents/subagents/swarm/dynamics src/agents/code-mode-swarm.dynamics.test.ts docs/tools/swarm-dynamics.md docs/concepts/mixed-phase-cognition.md docs/concepts/evidence-bound-convergence.md docs/concepts/swarm-dynamics-consolidation.md > .artifacts/swarm-qualification/format.txt 2>&1
          git diff --binary > .artifacts/swarm-qualification/format.patch
          git diff --check
      - name: Run repository-native dynamics and bridge tests
        id: tests
        continue-on-error: true
        run: |
          node scripts/run-vitest.mjs src/agents/subagents/swarm/dynamics/*.test.ts src/agents/code-mode-swarm.dynamics.test.ts > .artifacts/swarm-qualification/tests.txt 2>&1
      - name: Check changed source lint
        id: lint
        continue-on-error: true
        run: |
          node scripts/run-oxlint.mjs src/agents/subagents/swarm/dynamics src/agents/code-mode-swarm.runtime.ts src/agents/code-mode-swarm.dynamics.test.ts > .artifacts/swarm-qualification/lint.txt 2>&1
      - name: Capture public pinned dependencies for offline qualification
        if: always()
        run: |
          if test -d node_modules; then
            find node_modules packages extensions ui -type d -name node_modules -prune -print0 > "$RUNNER_TEMP/module-roots"
            tar --null -T "$RUNNER_TEMP/module-roots" -cf - | zstd -T0 -3 -o .artifacts/swarm-qualification/public-dependencies.tar.zst
          fi
          cp "$(command -v node)" .artifacts/swarm-qualification/node
          node -v > .artifacts/swarm-qualification/node-version.txt
          printf 'format=%s\ntests=%s\nlint=%s\n' '${{ steps.format.outcome }}' '${{ steps.tests.outcome }}' '${{ steps.lint.outcome }}' > .artifacts/swarm-qualification/outcomes.txt
      - name: Upload qualification evidence and public dependencies
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: swarm-qualification
          path: .artifacts/swarm-qualification/
          retention-days: 3
          if-no-files-found: error
          compression-level: 0
      - name: Enforce recorded results
        if: always()
        env:
          FORMAT: ${{ steps.format.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          LINT: ${{ steps.lint.outcome }}
        run: test "$FORMAT" = success && test "$TESTS" = success && test "$LINT" = success
