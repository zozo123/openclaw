name: Temporary Databricks baseline generator

on:
  push:
    branches:
      - tmp/databricks-generate-baseline

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24.19.0"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm config:docs:gen
      - name: Commit generated tracked baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/.generated/config-baseline.counts.json docs/.generated/config-baseline.sha256
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "tmp: generate Databricks config baseline"
          git push
