name: Databricks live workspace proof

on:
  push:
    branches:
      - databricks-live-proof

permissions:
  contents: read

jobs:
  live-proof:
    runs-on: ubuntu-latest
    env:
      RUN_DATABRICKS_LIVE_PROOF: "1"
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DATABRICKS_MODEL: ${{ vars.DATABRICKS_MODEL }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: databricks-live-proof
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Enable pnpm
        run: corepack enable
      - name: Verify proof secrets exist
        shell: bash
        run: |
          set +x
          if [ -z "$DATABRICKS_HOST" ] || [ -z "$DATABRICKS_TOKEN" ]; then
            echo "::error::Configure DATABRICKS_HOST and DATABRICKS_TOKEN as repository Actions secrets on zozo123/openclaw."
            exit 1
          fi
          echo "Databricks proof credentials are configured; values remain masked."
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Real OpenClaw to Databricks proof
        run: pnpm exec vitest run extensions/databricks/live.workspace.test.ts --config vitest.extensions.config.ts
      - name: Publish redacted proof summary
        if: success()
        run: |
          {
            echo "## Databricks live workspace proof"
            echo ""
            echo "- OpenClaw provider onboarding: ✅"
            echo "- Existing config preservation: ✅"
            echo "- Real Unity Gateway request: ✅"
            echo "- Streaming response path: ✅"
            echo "- Real model tool call: ✅"
            echo "- Tool result second turn: ✅"
            echo "- Final assistant response: ✅"
            echo "- Workspace: REDACTED"
            echo "- Credential: REDACTED"
          } >> "$GITHUB_STEP_SUMMARY"
