name: Temporary Swarm formatter

on:
  push:
    branches:
      - tmp/swarm-format-exact

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24.19.0"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec oxfmt --write src/agents/subagents/swarm/dynamics/dynamics-spawn.ts
      - name: Commit canonical formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/agents/subagents/swarm/dynamics/dynamics-spawn.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "tmp: apply exact swarm formatting"
          git push
