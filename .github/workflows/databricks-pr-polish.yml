name: Databricks PR polish

on:
  push:
    branches:
      - databricks-native-provider

permissions:
  contents: write

jobs:
  polish:
    if: github.repository == 'zozo123/openclaw'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: databricks-native-provider
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
        - name: Enable pnpm
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Format changed sources
        run: pnpm format
      - name: Regenerate config docs baseline
        run: pnpm config:docs:gen
      - name: Run Databricks extension tests
        run: pnpm test:extension databricks
      - name: Typecheck extensions
        run: pnpm tsgo:extensions:test
      - name: Commit generated polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extensions/databricks docs/providers/databricks.md docs/.generated
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "chore(databricks): format and regenerate config baseline"
          git push origin HEAD:databricks-native-provider
